[package]
name = "omni-release-app"
version = "0.1.0"
description = "Omni Release desktop shell"
authors = ["MakeShipHappen"]
edition = "2021"

[lib]
name = "omni_release_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-first foundation (Sprint 1). The DB lives in Rust so the command surface
# mirrors the future server REST API and no SQL touches the frontend.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
sha2 = "0.10"
# Native file picker for media import (called from Rust only; no JS capability needed).
tauri-plugin-dialog = "2"
# Blocking HTTP client for native calls to Supabase Edge Functions — the webview's
# fetch is rejected by a CORS preflight, but native HTTP isn't. rustls (no OpenSSL).
ureq = { version = "2", features = ["json", "tls"], default-features = false }
