[package]
name = "shipmemory"
version = "0.1.0"
description = "ShipMemory — the notepad buddy for the Ship ecosystem"
authors = ["MakeShipHappen"]
edition = "2021"

[lib]
name = "shipmemory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
