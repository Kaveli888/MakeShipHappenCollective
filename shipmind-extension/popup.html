<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShipMind</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        width: 240px;
        margin: 0;
        padding: 14px 16px;
        color: #1f2329;
      }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { font-size: 12px; margin: 0 0 12px; color: #5b6370; }
      .ok { color: #18794e; }
      .err { color: #b42318; }
      button {
        width: 100%;
        appearance: none;
        background: #1f2329;
        color: #fff;
        border: none;
        padding: 8px 10px;
        font-size: 13px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>ShipMind</h1>
    <p id="state">Checking…</p>
    <button id="open">Open settings</button>
    <script src="popup.js"></script>
  </body>
</html>
